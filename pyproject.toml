[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-writing"
version = "0.1.0"
description = "有证据、可追溯的长篇小说创作助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "numpy>=2.3,<3",
    "langgraph>=1,<3",
    "pypdfium2>=5.14,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=5,<7"]
ui = ["streamlit>=1.50,<2"]
ocr = ["tesserocr>=2.12,<3"]
desktop-build = ["pyinstaller>=6.18,<7"]

[project.scripts]
easy-writing = "easy_writing.cli:main"
easy-writing-desktop = "easy_writing.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easy_writing = ["storage/*.sql", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
